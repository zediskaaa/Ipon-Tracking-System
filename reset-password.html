<body data-page="reset-password" class="security-page">
  <main class="security-card" aria-labelledby="reset-title">
    <a class="security-brand" href="login.html" aria-label="IPON sign in">IPON</a>
    <h1 id="reset-title">Choose a new password</h1>
    <p>Use a password that is unique to IPON.</p>
    <form id="reset-password-form" class="form-grid" novalidate>
      <div class="field field-wide"><label for="reset-password">New password</label><input id="reset-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><small class="field-help">Use at least 8 characters with uppercase, lowercase, a number, and a symbol.</small></div>
      <div class="field field-wide"><label for="reset-password-confirmation">Confirm new password</label><input id="reset-password-confirmation" name="password_confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <button class="button button-primary field-wide" type="submit">Save new password</button>
      <p class="security-message field-wide" id="reset-password-message" role="alert" aria-live="polite"></p>
    </form>
  </main>
