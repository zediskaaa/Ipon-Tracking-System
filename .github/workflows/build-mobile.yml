name: Build Android App (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android 36 SDK Platform & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prepare and sync mobile assets
        run: npm run mobile:sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Generate Android update manifest
        run: |
          node -e '
            const fs = require("fs");
            const runNumber = Number(process.env.GITHUB_RUN_NUMBER || 100);
            const manifest = {
              version: `1.0.${runNumber}`,
              versionCode: runNumber,
              apkUrl: "https://github.com/zediskaaa/Ipon-Tracking-System/releases/latest/download/myIPON.apk",
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("android/app/build/outputs/apk/debug/app-update.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: myIPON-Android-APK
          path: |
            android/app/build/outputs/apk/debug/myIPON.apk
            android/app/build/outputs/apk/debug/app-update.json
          if-no-files-found: error

      - name: Publish Android APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "myIPON Mobile App (Latest Build)"
          body: |
            Automated mobile build for myIPON.

            - **Android:** Direct APK download: `myIPON.apk`

            *Automatically compiled and updated from the latest main branch commit.*
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/myIPON.apk
            android/app/build/outputs/apk/debug/app-update.json
