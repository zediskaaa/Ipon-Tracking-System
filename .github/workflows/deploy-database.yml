name: Deploy Supabase database

on:
  push:
    branches: [main]
    paths:
      - database/migrations/**
      - supabase/functions/**
      - scripts/supabase-migrate.mjs
      - .github/workflows/deploy-database.yml
  workflow_dispatch:
    inputs:
      from_version:
        description: Optional starting migration version (e.g. 20261114_046)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: production-supabase-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply migrations and deploy Edge Functions via Supabase CLI
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: woslmwokhhyszkgevnli
          FROM_VERSION: ${{ inputs.from_version }}
        run: |
          if [ -n "$FROM_VERSION" ]; then
            node scripts/supabase-migrate.mjs --apply --deploy-functions --from="$FROM_VERSION"
          else
            node scripts/supabase-migrate.mjs --apply --deploy-functions
          fi

      - name: Fallback PostgreSQL migration via SUPABASE_DB_URL
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && secrets.SUPABASE_DB_URL != '' }}
        shell: bash
        env:
          PGSSLMODE: require
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install --yes postgresql-client
          PROJECT_REF="woslmwokhhyszkgevnli"
          DB_URL="$SUPABASE_DB_URL"
          if [[ "$DB_URL" == *"pooler.supabase.com"* ]] && [[ "$DB_URL" =~ ://postgres: ]]; then
            DB_URL="${DB_URL/:\/\/postgres:/:\/\/postgres.${PROJECT_REF}:}"
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 --file database/migrations/0000_create_migration_ledger.sql
          for migration in database/migrations/20*.sql; do
            filename="${migration##*/}"
            version="$(cut -d_ -f1-2 <<< "$filename")"
            applied="$(psql "$DB_URL" -Atqc "select exists (select 1 from public.schema_migrations where version = '$version');")"
            if [[ "$applied" == "t" ]]; then
              echo "Skipping $filename (already applied)"
            else
              echo "Applying $filename"
              psql "$DB_URL" -v ON_ERROR_STOP=1 --file "$migration"
            fi
          done

      - name: Warn if neither Supabase secret is configured
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && secrets.SUPABASE_DB_URL == '' }}
        run: |
          echo "::warning title=Missing Secret::Set SUPABASE_ACCESS_TOKEN (recommended) or SUPABASE_DB_URL in GitHub repository secrets for automatic Supabase migrations and Edge Function deploys."
