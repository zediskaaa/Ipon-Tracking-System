<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPON</title></head><body><p>Opening IPON…</p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>const c=window.IPON_CONFIG||{};if(!/^https:\/\/.+\.supabase\.co$/i.test(c.supabaseUrl||'')){location.replace('login.html')}else{const s=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);s.auth.getSession().then(({data})=>location.replace(data.session?'dashboard.html':'login.html'))}</script></body></html>
